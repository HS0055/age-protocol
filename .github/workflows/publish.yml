name: publish
# npm provenance requires publishing from a supported CI with an OIDC token,
# so this workflow is the only way v0.1.0 gets published. A laptop cannot
# produce a provenance attestation, and a package published without one
# cannot gain it retroactively.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Pack and check without publishing
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install cryptography

      # Never publish something that has not just proved itself.
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test

      # The tarballs verified here are the exact files published below. They
      # used to be different things: this step packed with pnpm, which rewrites
      # workspace:* to a real version, while the publish step ran npm publish
      # on the directory, which does not. cli 0.1.1 shipped depending on
      # "workspace:*" and could not be installed by anyone. Packing once and
      # publishing those same bytes means the thing tested is the thing shipped.
      - name: pack once
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dist"
          for pkg in receipts cli; do
            ( cd "packages/$pkg" && pnpm pack --pack-destination "$RUNNER_TEMP/dist" )
          done
          ls -l "$RUNNER_TEMP/dist"

      # Installed with npm, not unpacked by hand, so npm resolves each tarball's
      # dependencies exactly as a user's install would. A workspace: specifier
      # or any other unpublishable reference fails here instead of on npm.
      - name: install the tarballs the way a user would, then verify a receipt
        run: |
          set -euo pipefail
          for tgz in "$RUNNER_TEMP/dist"/*.tgz; do
            if tar -xzOf "$tgz" package/package.json | grep -q '"workspace:'; then
              echo "::error::$(basename "$tgz") still declares a workspace: dependency"; exit 1
            fi
          done
          APP="$RUNNER_TEMP/app"
          mkdir -p "$APP" && cd "$APP" && npm init -y >/dev/null
          npm install --no-audit --no-fund "$RUNNER_TEMP"/dist/ageprotocol-receipts-*.tgz "$RUNNER_TEMP"/dist/ageprotocol-cli-*.tgz
          cp "$GITHUB_WORKSPACE/docs/protocol/receipt.json" "$GITHUB_WORKSPACE/docs/protocol/age-jwks.json" .
          npx --no-install agectl verify receipt.json --jwks age-jwks.json

      # npm publish, not pnpm publish: pnpm does not implement provenance and
      # ignores --provenance without a word, which is how v0.1.0 shipped with
      # no attestation. A version already on npm is skipped rather than failing
      # the run, so a release that changes one package does not need the other
      # bumped. Dependency order matters: the CLI depends on receipts.
      - name: publish with provenance
        if: github.event_name == 'release' || inputs.dry_run == false
        run: |
          set -euo pipefail
          for pkg in receipts cli; do
            name=$(node -p "require('./packages/$pkg/package.json').name")
            version=$(node -p "require('./packages/$pkg/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already published, skipping"
              continue
            fi
            npm publish "$RUNNER_TEMP"/dist/ageprotocol-$pkg-$version.tgz --provenance --access public
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: dry run
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run == true
        run: |
          set -euo pipefail
          for pkg in receipts cli; do
            version=$(node -p "require('./packages/$pkg/package.json').version")
            npm publish "$RUNNER_TEMP"/dist/ageprotocol-$pkg-$version.tgz --provenance --access public --dry-run
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
